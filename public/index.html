<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Responsive meta tag so the page scales properly on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Group Chat (Responsive)</title>
    <style>
      /* Base Styles */
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f4;
      }
      .chat-container {
        width: 80%;
        max-width: 600px;
        margin: 20px auto;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 10px #999;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        overflow-y: scroll;
        padding: 10px;
        border-bottom: 1px solid #ccc;
        min-height: 200px; /* fallback if chat is empty */
      }
      .messages p {
        margin: 5px 0;
        padding: 5px 10px;
        border-radius: 4px;
      }
      .system {
        background-color: #ddd;
      }
      .user-message {
        background-color: #cce5ff;
      }
      .form-container {
        display: flex;
      }
      .form-container input {
        flex: 1;
        padding: 10px;
        font-size: 1rem;
        border: none;
        outline: none;
      }
      .form-container button {
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        background: #007bff;
        color: #fff;
        cursor: pointer;
      }
      .form-container button:hover {
        background: #0056b3;
      }

      /* Modal Styles */
      .username-modal {
        position: fixed;
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        display: flex; 
        align-items: center; 
        justify-content: center;
        z-index: 9999; /* appear on top */
      }
      .username-dialog {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        max-width: 400px;
        width: 80%;
      }
      .username-dialog input {
        margin-bottom: 10px;
        width: 80%;
        padding: 10px;
        font-size: 1rem;
      }

      /* Responsive Media Query */
      @media (max-width: 600px) {
        .chat-container {
          width: 95%;
          margin: 10px auto;
          border-radius: 0;
          box-shadow: none;
        }
        .username-dialog {
          width: 90%;
        }
        .messages {
          min-height: 300px; /* a bit larger for mobile if desired */
        }
        .form-container button {
          font-size: 1rem;
          padding: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Username Modal -->
    <div class="username-modal" id="username-modal">
      <div class="username-dialog">
        <h2>Enter Your Username</h2>
        <input type="text" id="username-input" placeholder="Choose a username" />
        <br />
        <button onclick="joinChat()">Join Chat</button>
      </div>
    </div>

    <!-- Main Chat Container -->
    <div class="chat-container" style="display:none;" id="chat-container">
      <!-- Messages Section -->
      <div class="messages" id="messages"></div>

      <!-- Input/Send Section -->
      <div class="form-container">
        <input id="message-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <!-- SOCKET.IO SCRIPT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Connect to Socket.IO
      const socket = io();

      // Grab elements
      const usernameModal = document.getElementById('username-modal');
      const usernameInput = document.getElementById('username-input');
      const chatContainer = document.getElementById('chat-container');
      const messages = document.getElementById('messages');
      const messageInput = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');

      // Function to join the chat after entering a username
      function joinChat() {
        const username = usernameInput.value.trim();
        if (username) {
          // Send "join" event to server
          socket.emit('join', username);

          // Hide username modal, show chat container
          usernameModal.style.display = 'none';
          chatContainer.style.display = 'flex'; // or 'block', but 'flex' is used since we have flex styling
        }
      }

      // Send message on button click
      sendBtn.addEventListener('click', () => {
        const msg = messageInput.value.trim();
        if (msg) {
          // Emit a chat message event
          socket.emit('chat message', msg);
          messageInput.value = '';
        }
      });

      // Optionally: send message on "Enter" key
      messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendBtn.click();
        }
      });

      // Listen for messages from server
      socket.on('chat message', (data) => {
        const { username, message } = data;
        const p = document.createElement('p');

        if (username === 'System') {
          p.classList.add('system');
        } else {
          p.classList.add('user-message');
        }

        p.textContent = username + ': ' + message;
        messages.appendChild(p);

        // Auto-scroll to bottom
        messages.scrollTop = messages.scrollHeight;
      });
    </script>
  </body>
</html>
